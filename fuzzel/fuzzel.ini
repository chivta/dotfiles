# Launcher styled after hypr/hyprland.lua: 2 px border in the active-border
# pink, 10 px rounding, and a translucent black background that Hyprland blurs
# (see the "launcher" layer rule there).

[main]
font=Noto Sans:size=12
icon-theme=breeze-dark
terminal=kitty -e
lines=10
width=40
horizontal-pad=24
vertical-pad=18
inner-pad=12
line-height=26

[colors]
# waybar's background, rgba(0, 0, 0, 0.75)
background=000000bf
text=eeeeeeff
input=eeeeeeff
placeholder=aaaaaaff
counter=aaaaaaff
# active_border gradient start
prompt=f84e7aff
match=f84e7aff
border=f84e7aee
# active_border gradient end
selection=800928ee
selection-text=ffffffff
selection-match=ffb3c7ff

[border]
width=2
radius=10
selection-radius=6

general {
    hide_cursor = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    color = rgba(0, 0, 0, 0.5)
}

# TIME
label {
    monitor =
    text = $TIME
    font_size = 26
    font_family = Monospace
    color = rgba(255, 255, 255, 1.0)

    position = 0, 70
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%d.%m.%Y"
    font_size = 10
    font_family = Monospace
    color = rgba(255, 255, 255, 0.8)

    position = 0, 35
    halign = center
    valign = center
}

# PASSWORD INPUT
input-field {
    monitor =
    size = 175, 30
    outline_thickness = 2
    
    outer_color = rgba(255, 255, 255, 0.3)
    inner_color = rgba(0, 0, 0, 0.5)
    font_color = rgba(255, 255, 255, 1.0)
    
    check_color = rgba(0, 255, 0, 0.5)
    fail_color = rgba(255, 0, 0, 0.5)
    
    fade_on_empty = false
    rounding = 10
    
    placeholder_text = 
    
    position = 0, 0
    halign = center
    valign = center
}


# LAYOUT
label {
    monitor =
    text = $LAYOUT[en,ua]
    font_size = 10
    font_family = Monospace
    color = rgba(255, 255, 255, 0.6)

    position = 105, 0
    halign = center
    valign = center
}

# Local development only. Never used for staging or production.
services:
  mybot:
    build:
      context: .
      target: dev
    env_file: .env
    environment:
      DB_PATH: /app/data/mybot.db
    volumes:
      - .:/app
      - mybot-data:/app/data
    ports:
      - "8080:8080"

volumes:
  mybot-data:

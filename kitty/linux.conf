# Linux/Hyprland. Kitty actions live on ctrl+shift: bare ctrl belongs to the
# shell (ctrl+d EOF, ctrl+w kill-word, ctrl+c SIGINT, ctrl+z suspend) except
# ctrl+q, zitty's previous tab; super belongs to Hyprland. kitty_mod+shift+X
# collapses to ctrl+shift+X here, so mac's cmd+X and cmd+shift+X layers share
# one chord.
kitty_mod ctrl+shift

map ctrl+shift+t new_tab
# hsplit gets ctrl+alt: ctrl+shift+d is vsplit (mac uses cmd+shift+d)
map --allow-fallback=shifted,ascii ctrl+alt+d launch --location=hsplit --cwd=current
# toggle between the two most recently used windows
map ctrl+shift+grave nth_window -1

# --- clipboard ---------------------------------------------------------------
# ctrl+shift+c / ctrl+shift+v are kitty's Linux defaults and stay unbound here.
map --allow-fallback=shifted,ascii ctrl+shift+y launch --stdin-source=@last_cmd_output --stdin-add-formatting=false --type=background wl-copy

# --- readline-style line editing ---------------------------------------------
# home/end and ctrl+u/ctrl+k already cover line start/end on Linux.
# ctrl+arrow is the Linux word-jump convention.
map ctrl+left  send_text all \x1b\x62
map ctrl+right send_text all \x1b\x66
# ctrl+backspace / ctrl+delete -> delete word backward / forward
map ctrl+backspace send_text all \x17
map ctrl+delete    send_text all \x1bd

# --- swallow unbound ctrl+shift chords ---------------------------------------
# Apps that turn on the kitty keyboard protocol (Claude Code, neovim, helix)
# ask kitty to report every key, so an unbound chord arrives at the app as a
# literal CSI-u sequence and lands in the input buffer as garbage, e.g.
# ctrl+shift+h -> CSI 104 ; 6 u, shown as "104;6u".
# discard_event drops the event in kitty: neither kitty nor the app sees it.
# (no_op would do the opposite - it unbinds, which is what leaks the sequence.)
#
# Bare ctrl is deliberately absent: every ctrl+<letter> is a live shell key.
# ctrl+shift+c/v (copy/paste), ctrl+tab and ctrl+shift+tab (tab cycling) keep
# their kitty defaults, as do the combos bound above, in kitty.conf and in
# zitty.conf.
map ctrl+shift+e discard_event
map ctrl+shift+g discard_event
map ctrl+shift+h discard_event
map ctrl+shift+j discard_event
map ctrl+shift+n discard_event
map ctrl+shift+o discard_event
map ctrl+shift+p discard_event
map ctrl+shift+r discard_event
map ctrl+shift+s discard_event
map ctrl+shift+u discard_event
map ctrl+shift+x discard_event
map ctrl+shift+z discard_event
map ctrl+shift+, discard_event
map ctrl+shift+. discard_event
map ctrl+shift+; discard_event
map ctrl+shift+' discard_event
map ctrl+shift+backslash discard_event
map ctrl+shift+up discard_event
map ctrl+shift+down discard_event
map ctrl+shift+home discard_event
map ctrl+shift+end discard_event
map ctrl+shift+page_up discard_event
map ctrl+shift+page_down discard_event
map ctrl+shift+backspace discard_event
map ctrl+shift+delete discard_event
map ctrl+shift+space discard_event
map ctrl+shift+escape discard_event
map ctrl+shift+insert discard_event
map ctrl+shift+f1 discard_event
map ctrl+shift+f2 discard_event
map ctrl+shift+f3 discard_event
map ctrl+shift+f4 discard_event
map ctrl+shift+f5 discard_event
map ctrl+shift+f6 discard_event
map ctrl+shift+f7 discard_event
map ctrl+shift+f8 discard_event
map ctrl+shift+f9 discard_event
map ctrl+shift+f10 discard_event
map ctrl+shift+f11 discard_event
map ctrl+shift+f12 discard_event
include zitty-home.conf

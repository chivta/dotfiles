map backspase normal
# --allow-fallback=shifted,ascii makes letter shortcuts match the physical key
# position, so they also fire on the Ukrainian layout (cmd+d == cmd+в).
map --allow-fallback=shifted,ascii ctrl+q goto_tab -1
map --allow-fallback=shifted,ascii cmd+q goto_tab -1
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9
map cmd+0 goto_tab 10
# jump to beginning and end of word
map alt+left send_text all \x1b\x62
map alt+right send_text all \x1b\x66
# jump to beginning and end of line
map cmd+left send_text all \x01
map cmd+right send_text all \x05
# Cmd+Backspace -> delete to start of line (sends Ctrl+U)
map cmd+backspace send_text all \x15

# Cmd+Delete -> delete to end of line (sends Ctrl+K)
map cmd+delete send_text all \x0b
enabled_layouts splits   
map --allow-fallback=shifted,ascii cmd+d launch --location=vsplit
map --allow-fallback=shifted,ascii cmd+shift+d launch --location=hsplit
map --allow-fallback=shifted,ascii cmd+w close_window
map cmd+shift+right next_window
map cmd+shift+left previous_window
map cmd+shift+enter layout_action rotate
map --allow-fallback=shifted,ascii cmd+shift+m detach_window ask

font_size 13.0


map --allow-fallback=shifted,ascii cmd+shift+f move_window_forward
map --allow-fallback=shifted,ascii cmd+shift+b move_window_backward


shell_integration enabled
map cmd+shift+c launch --stdin-source=@last_cmd_output --stdin-add-formatting=false --type=background pbcopy

# --- swallow unbound cmd chords ---------------------------------------------
# Apps that turn on the kitty keyboard protocol (Claude Code, neovim, helix)
# ask kitty to report every key, so an unbound cmd chord arrives at the app as
# a literal CSI-u sequence and lands in the input buffer as garbage, e.g.
# cmd+shift+v -> CSI 118 ; 10 u, shown as "118;10u".
# discard_event drops the event in kitty: neither kitty nor the app sees it.
# (no_op would do the opposite - it unbinds, which is what leaks the sequence.)
# Combos already bound above or by kitty's macOS defaults are deliberately absent.

map cmd+a discard_event
map cmd+b discard_event
map cmd+e discard_event
map cmd+g discard_event
map cmd+i discard_event
map cmd+j discard_event
map cmd+o discard_event
map cmd+p discard_event
map cmd+s discard_event
map cmd+u discard_event
map cmd+x discard_event
map cmd+y discard_event
map cmd+z discard_event
map cmd+[ discard_event
map cmd+] discard_event
map cmd+\ discard_event
map cmd+; discard_event
map cmd+' discard_event
map cmd+. discard_event
map cmd+/ discard_event
map cmd+tab discard_event
map cmd+space discard_event
map cmd+escape discard_event
map cmd+insert discard_event
map cmd+f1 discard_event
map cmd+f2 discard_event
map cmd+f3 discard_event
map cmd+f4 discard_event
map cmd+f5 discard_event
map cmd+f6 discard_event
map cmd+f7 discard_event
map cmd+f8 discard_event
map cmd+f9 discard_event
map cmd+f10 discard_event
map cmd+f11 discard_event
map cmd+f12 discard_event


# Shared kitty config. kitty_mod is cmd on macOS and ctrl+shift on Linux (set in
# the per-OS file), so "kitty_mod+X" is cmd+X / ctrl+shift+X and
# "kitty_mod+shift+X" is cmd+shift+X / ctrl+shift+X.
#
# --allow-fallback=shifted,ascii makes letter shortcuts match the physical key
# position, so they also fire on the Ukrainian layout (kitty_mod+d == kitty_mod+в).

shell_integration enabled
enabled_layouts splits

# Confirm closing an OS window or tab (WM close button, close_tab, quit) only
# when one of its windows runs a command; idle shell prompts don't count.
# Needs shell_integration. Same as kitty's current default, pinned here.
confirm_os_window_close -1

# --- tabs --------------------------------------------------------------------
map kitty_mod+1 goto_tab 1
map kitty_mod+2 goto_tab 2
map kitty_mod+3 goto_tab 3
map kitty_mod+4 goto_tab 4
map kitty_mod+5 goto_tab 5
map kitty_mod+6 goto_tab 6
map kitty_mod+7 goto_tab 7
map kitty_mod+8 goto_tab 8
map kitty_mod+9 goto_tab 9
map kitty_mod+0 goto_tab 10
# toggle between the two most recently used tabs
map --allow-fallback=shifted,ascii kitty_mod+q goto_tab -1

# --- splits and windows ------------------------------------------------------
map --allow-fallback=shifted,ascii kitty_mod+d launch --location=vsplit
# ignore-shell: no prompt when the window just sits at a shell prompt
map --allow-fallback=shifted,ascii kitty_mod+w close_window_with_confirmation ignore-shell
map kitty_mod+shift+right next_window
map kitty_mod+shift+left  previous_window
map kitty_mod+shift+enter layout_action rotate
map --allow-fallback=shifted,ascii kitty_mod+shift+f move_window_forward
map --allow-fallback=shifted,ascii kitty_mod+shift+b move_window_backward
map --allow-fallback=shifted,ascii kitty_mod+shift+m detach_window ask

# --- line editing ------------------------------------------------------------
# alt+left / alt+right -> word back / forward
map alt+left  send_text all \x1b\x62
map alt+right send_text all \x1b\x66

# Per-OS: kitty_mod, bindings that differ, and the discard_event lists.
# Must stay last so the OS file can override anything above.
include ${KITTY_OS}.conf

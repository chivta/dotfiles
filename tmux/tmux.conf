# Allow external applications to set the system clipboard via OSC 52
set -s set-clipboard on

# Allow Claude Code to bypass tmux restrictions using escape sequences
set -as terminal-features ',xterm*:passthrough'
set -g allow-passthrough on

unbind C-b
set -g prefix C-a
bind C-a send-prefix

unbind l
bind q last-window
set -g mouse on

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Auto-save every 15 minutes and auto-restore on tmux start
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Reopen Claude Code panes on restore. --continue picks the latest conversation
# in the pane's directory, so two claude panes in one dir resume the same one.
set -g @resurrect-processes '"claude->claude --continue"'

# Keep kitmux's per-tab helper sessions (main__<n>) out of resurrect saves, so a
# restore brings back only the sessions themselves. List every session mirrored
# with kitmux after the path.
set -g @resurrect-hook-post-save-layout '~/.local/bin/kitmux-resurrect-hook main'

# Initialize TPM (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
